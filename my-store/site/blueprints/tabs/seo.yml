# SEO Tab Blueprint
# Reusable across all page types

label: SEO
icon: search
columns:
  - width: 1/2
    fields:
      metaTitle:
        label: Meta Title
        type: text
        maxlength: 60
        translate: true
        help: "Recommended: 50-60 characters"
        icon: title
      metaDescription:
        label: Meta Description
        type: textarea
        maxlength: 160
        translate: true
        help: "Recommended: 150-160 characters"
        icon: description
  - width: 1/2
    fields:
      canonicalUrl:
        label: Canonical URL
        type: text
        icon: link
      robots:
        label: Robots Meta
        type: select
        options:
          - index,follow
          - index,nofollow
          - noindex,follow
          - noindex,nofollow
        default: index,follow
        icon: robot
      ogTitle:
        label: OpenGraph Title
        type: text
        translate: true
        icon: facebook
      ogDescription:
        label: OpenGraph Description
        type: textarea
        translate: true
        icon: facebook
      ogImage:
        label: OpenGraph Image
        type: files
        max: 1
        accepts: image/*
        help: "Recommended: 1200x630px"
        icon: image
      twitterCard:
        label: Twitter Card Type
        type: select
        options:
          - summary
          - summary_large_image
          - app
          - player
        default: summary_large_image
        icon: twitter
      schemaType:
        label: Schema.org Type
        type: select
        options:
          - Product
          - Service
          - Organization
          - LocalBusiness
          - Article
          - Event
          - FAQPage
          - BreadcrumbList
        icon: sitemap
      structuredData:
        label: Custom Structured Data (JSON-LD)
        type: code
        language: json
        help: "Additional schema markup"
        icon: code
